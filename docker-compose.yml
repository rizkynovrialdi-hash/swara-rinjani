

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: rinjani
      POSTGRES_PASSWORD: rinjani_dev_password
      POSTGRES_DB: rinjani
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # Aktifkan service di bawah ini setelah apps/web dan apps/api di-init
